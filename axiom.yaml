name: christiangeorgelucas/architect-tools
version: 0.3.0
language: python
description: >-
  Flow Architect node package — the agentic backend of the AI flow author.
  A single fast build agent: Claude Code (via the Anthropic Agent SDK, Sonnet
  by default) with the axiom CLI and the flow-authoring skill finds published
  marketplace components, wires them into a flow, compiles, smoke-tests, and
  saves the draft — tuned for speed (the output is a canvas draft the user
  reviews, not a marketplace publish). Compose-only: refuses honestly when
  the marketplace lacks the needed nodes.

build:
  # Python is the only language whose system_deps reach the RUNTIME image;
  # `axiom` bakes the injected CLI in, `nodejs` backs the bundled Claude Code
  # CLI the Python claude-agent-sdk drives.
  system_deps:
    - nodejs
    - axiom
  # This is a two-runtime image (python + nodejs) that also pip-installs
  # claude-agent-sdk (bundles the Claude Code CLI = thousands of files). It
  # builds in <1m natively, but unpacking under the registry's gVisor sandbox
  # crosses the default 15m budget. Raise it (floored + clamped to 30m).
  timeout: "28m"

nodes:
  - name: BuildStep
    description: >-
      One bounded build round (self-loop) — Claude Code + the axiom CLI finds
      marketplace nodes, wires the flow, compiles, smoke-tests once, and saves
      the draft. An empty user_request is a cheap warmup ping (returns
      immediately; used by the editor to pre-warm the pod).
    input: BuildState
    output: BuildState
    required_secrets:
      - ANTHROPIC_API_KEY
      - AXIOM_API_KEY

  - name: FinalizeResult
    description: Shape the closed-enum terminal ArchitectResult.
    input: ArchitectResult
    output: ArchitectResult

  - name: ErrShape
    description: on_error funnel; shape a failing NodeError into a failed ArchitectResult.
    input: ErrInfo
    output: ArchitectResult
