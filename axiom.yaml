name: christiangeorgelucas/architect-tools
version: 0.1.0
language: python
description: >-
  Flow Architect node package — the agentic backend of the in-editor AI flow
  author. Runs Claude Code (via the Anthropic Agent SDK) with the axiom CLI and
  the flow-authoring skill to plan, build, and verify Axiom flows from published
  marketplace components, one durable HITL chat session at a time. Compose-only:
  refuses honestly when the marketplace lacks the needed nodes.

build:
  # Python is the only language whose system_deps reach the RUNTIME image;
  # `axiom` bakes the injected CLI in, `nodejs` backs the bundled Claude Code
  # CLI the Python claude-agent-sdk drives.
  system_deps:
    - nodejs
    - axiom

nodes:
  - name: InitSession
    description: Seed a chat session; log in and warm the authoring skill.
    input: SessionEnvelope
    output: SessionEnvelope
    required_secrets:
      - AXIOM_API_KEY
      - ANTHROPIC_API_KEY

  - name: AgentTurn
    description: One conversational/planning step; decides reply, run_planner, or honest refusal.
    input: SessionEnvelope
    output: SessionEnvelope
    required_secrets:
      - ANTHROPIC_API_KEY
      - AXIOM_API_KEY

  - name: AwaitUser
    description: HITL pause point; echoes the resumed envelope.
    input: SessionEnvelope
    output: SessionEnvelope

  - name: Rejoin
    description: Chat-loop head funnel (XOR join in flow config); echo.
    input: SessionEnvelope
    output: SessionEnvelope

  - name: Carrier
    description: Carrier-funnel echo routing session state around the planner subflow.
    input: SessionEnvelope
    output: SessionEnvelope

  - name: PostprocessPlan
    description: Filter the planner's false gaps and mark the session plan-ready (no LLM).
    input: SessionEnvelope
    output: SessionEnvelope
    required_secrets:
      - AXIOM_API_KEY

  - name: BuildStep
    description: One bounded compose-only build chunk (self-loop) via Claude Code + the axiom CLI.
    input: BuildState
    output: BuildState
    required_secrets:
      - ANTHROPIC_API_KEY
      - AXIOM_API_KEY

  - name: VerifyFlow
    description: Deterministic validate to compile to assemble; emits the SourceGraph the editor applies.
    input: BuildState
    output: VerifyResult
    required_secrets:
      - AXIOM_API_KEY
      - ANTHROPIC_API_KEY

  - name: FinalizeResult
    description: Shape the closed-enum terminal ArchitectResult.
    input: ArchitectResult
    output: ArchitectResult

  - name: ErrShape
    description: on_error funnel; shape a failing NodeError into a failed ArchitectResult.
    input: ErrInfo
    output: ArchitectResult
