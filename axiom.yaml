name: christiangeorgelucas/architect-tools
version: 0.2.1
language: python
description: >-
  Flow Architect node package — the agentic backend of the AI flow author.
  A build↔review agent pair: the build node runs Claude Code (via the
  Anthropic Agent SDK) with the axiom CLI and the flow-authoring skill to
  plan, build, and live-test an Axiom flow from published marketplace
  components; the review node is an independent second agent that re-verifies
  the result from scratch before it ships. Compose-only: refuses honestly
  when the marketplace lacks the needed nodes.

build:
  # Python is the only language whose system_deps reach the RUNTIME image;
  # `axiom` bakes the injected CLI in, `nodejs` backs the bundled Claude Code
  # CLI the Python claude-agent-sdk drives.
  system_deps:
    - nodejs
    - axiom
  # This is a two-runtime image (python + nodejs) that also pip-installs
  # claude-agent-sdk (bundles the Claude Code CLI = thousands of files). It
  # builds in <1m natively, but unpacking under the registry's gVisor sandbox
  # crosses the default 15m budget. Raise it (floored + clamped to 30m).
  timeout: "28m"

nodes:
  - name: BuildStep
    description: One bounded build round (self-loop) — Claude Code + the axiom CLI plans, builds, live-tests and saves the flow.
    input: BuildState
    output: BuildState
    required_secrets:
      - ANTHROPIC_API_KEY
      - AXIOM_API_KEY

  - name: ReviewStep
    description: Independent reviewer agent — re-runs the oracle from scratch; approves (assembled graph) or rejects with findings.
    input: BuildState
    output: ReviewVerdict
    required_secrets:
      - ANTHROPIC_API_KEY
      - AXIOM_API_KEY

  - name: FinalizeResult
    description: Shape the closed-enum terminal ArchitectResult.
    input: ArchitectResult
    output: ArchitectResult

  - name: ErrShape
    description: on_error funnel; shape a failing NodeError into a failed ArchitectResult.
    input: ErrInfo
    output: ArchitectResult
