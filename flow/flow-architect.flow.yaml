# Flow Architect — AI flow author, as an Axiom flow.
#
# 0.3.0 (founder speed directive 2026-08-10): a SINGLE fast build agent with a
# bounded self-loop. The independent review agent was removed — the output is
# a DRAFT on the user's canvas that the user reviews and runs themselves;
# speed beats certainty. The flow graph provides only what the agent can't:
# durability, chunking under the per-call ceiling, and typed error routing.
#
#   @flow_input → build ⟲ (bounded rounds) → finalize → @flow_output
#   build ─[gave_up]→ finalize;  on_error(build) → err_shape → finalize

name: christiangeorgelucas/flow-architect
version: 0.3.0
description: >-
  AI flow author. Give it a request (and optionally your current draft canvas)
  and a fast build agent plans, wires, compiles, smoke-tests and saves an
  Axiom flow composed from published marketplace components — a draft on your
  canvas in a couple of minutes. Compose-only: refuses honestly when the
  marketplace lacks the needed nodes.

input_facade:
  message_name: ArchitectRequest
  description: Start a Flow Architect build session.
  fields:
    graph_id:
      kind: string
      description: The editor draft's GRAPH artifact id; empty for a brand-new flow.
    graph_source_json:
      kind: string
      description: The serialized canvas (SourceGraph JSON) to modify; empty for a brand-new flow.
    user_message:
      kind: string
      description: The user's request — what the flow should do.
    model:
      kind: string
      description: Optional Anthropic model override (default claude-sonnet-5).
  example_input:
    graph_id: ""
    graph_source_json: ""
    user_message: "Turn an RSS feed into a daily digest email"
    model: ""

output_facade:
  message_name: ArchitectResult
  description: The session outcome.
  fields:
    status:
      kind: string
      description: done | refused | failed | cancelled.
    summary:
      kind: string
      description: Human-readable outcome.
    updated_graph_json:
      kind: string
      description: The SourceGraph the editor applies (status done).
    flow_yaml:
      kind: string
      description: The final flow.yaml (status done; possibly partial on failed).
    graph_id:
      kind: string
      description: The saved draft GRAPH artifact id — the editor binds the open tab to this document (status done).
    missing_capabilities_json:
      kind: string
      description: Gap detail (status refused).
    verify_report_json:
      kind: string
      description: Legacy reviewer report — empty in 0.3.0.
    error:
      kind: string
      description: Failure description (status failed).

run_config:
  secret_refs:
    - ANTHROPIC_API_KEY
    - AXIOM_API_KEY

nodes:
  - alias: build
    package: christiangeorgelucas/architect-tools@0.3.0
    node: BuildStep
    config:
      retry: { max_attempts: 2, initial_interval_ms: 1000, backoff_coefficient: 2.0 }

  - alias: err_shape
    package: christiangeorgelucas/architect-tools@0.3.0
    node: ErrShape
    config:
      join: { kind: XOR }

  - alias: finalize
    package: christiangeorgelucas/architect-tools@0.3.0
    node: FinalizeResult
    config:
      join: { kind: XOR }

edges:
  # Entry.
  - { from: "@flow_input", to: build, adapter: { user_request: user_message, client_graph_json: graph_source_json, draft_graph_id: graph_id, model: model } }

  # Build self-loop: bounded rounds under the per-call ceiling. The node
  # bounds itself (MAX_BUILD_ROUNDS → honest gave_up); max_iterations is the
  # platform backstop. Explicit adapter: back-edges bypass the mapping gate.
  - from: build
    to: build
    loop: true
    max_iterations: 6
    condition: { op: CEL, cel: '!done' }
    adapter:
      user_request: user_request
      client_graph_json: client_graph_json
      draft_graph_id: draft_graph_id
      model: model
      flow_yaml: flow_yaml
      graph_id: graph_id
      artifact_id: artifact_id
      test_evidence_json: test_evidence_json
      work_log_json: work_log_json
      round: round

  # Build finished → terminal result (the user is the reviewer now). ONE edge
  # for both outcomes — the platform allows a single forward edge per
  # (source, destination) pair — with CEL ternaries picking the refusal shape
  # when the agent gave up (capability gap or budget).
  - from: build
    to: finalize
    condition: { op: CEL, cel: 'done' }
    adapter:
      status: 'status == "gave_up" ? "refused" : "done"'
      summary: 'status == "gave_up" ? "Could not build this from published marketplace components." : summary'
      updated_graph_json: updated_graph_json
      missing_capabilities_json: gap_json
      flow_yaml: flow_yaml
      graph_id: graph_id
      error: error

  # Error funnel. err_shape stays separate from finalize because a (from,to)
  # pair cannot carry both a normal and an on_error edge.
  - { from: build, to: err_shape, on_error: true, adapter: { reason: message } }
  - { from: err_shape, to: finalize }

  # Terminal.
  - { from: finalize, to: "@flow_output", adapter: { status: status, summary: summary, updated_graph_json: updated_graph_json, flow_yaml: flow_yaml, graph_id: graph_id, missing_capabilities_json: missing_capabilities_json, verify_report_json: verify_report_json, error: error } }
