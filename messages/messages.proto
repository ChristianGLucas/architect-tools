// Devbox e2e planner stub contracts — mirrors the REAL flow-planner-fanout
// facade surface (feasible / skeleton_yaml / steps[] with matched/package/
// node/score/pick_reason) closely enough that flow-architect's plan_post and
// the editor's PlanCard behave exactly as they do against the real planner.
syntax = "proto3";

package axiom_official.planner_stub;

// PlanRequest matches the planner subflow's input facade surface.
message PlanRequest {
  string description = 1;
  string model = 2;
}

// PlanStep is one plan step verdict, shaped like the real planner's.
//
// FIELD NUMBERS ARE ALPHABETICAL BY NAME — deliberately. The flow facade
// synthesized around this message numbers its nested fields alphabetically
// (treeSynth sorts for determinism), while the @flow_output adapter copies
// repeated-message bytes VERBATIM from this proto. Until the platform
// transcodes nested messages across that boundary (filed:
// backlog/facade-nested-message-transcode.md), the two numberings must
// agree or every step field decodes shifted/zeroed.
message PlanStep {
  bool matched = 1;
  string node = 2;
  string package = 3;
  string pick_reason = 4;
  double score = 5;
}

// PlanResult is the canned plan the stub emits.
message PlanResult {
  bool feasible = 1;
  string skeleton_yaml = 2;
  repeated PlanStep steps = 3;
}
